server:
  port: 8080
spring:
  application:
    name: retina-ai-platform
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB
retina:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-5.2}
      enabled: ${OPENAI_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
